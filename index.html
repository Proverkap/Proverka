<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Destiny — Визуальные новеллы</title>
<style>
:root{--bg:#090611;--panel:#171223;--panel2:#21172f;--gold:#d4aa55;--gold2:#f5d77f;--muted:#bfb6c6;--line:rgba(212,170,85,.36)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#322049 0,#120c1b 36%,#07050a 100%);color:#f7f1e8;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:920px;margin:auto;padding:24px 16px 88px}.brand{text-align:center;padding:10px 0 18px;font-family:Georgia,serif;color:var(--gold2);font-size:38px;font-style:italic;text-shadow:0 0 18px rgba(245,215,127,.18)}
.brand span{display:block;font:11px/1.4 Inter,sans-serif;letter-spacing:5px;text-transform:uppercase;color:#a49aa9;margin-top:4px}
.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 18px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:rgba(18,12,28,.66);color:#ded5e1;border-radius:22px;padding:10px 14px;white-space:nowrap;cursor:pointer}.tab.active{background:linear-gradient(180deg,#5e3d21,#2e1d22);color:#fff2c0;box-shadow:0 0 22px rgba(212,170,85,.18)}
.list{display:grid;gap:16px}.card{display:grid;grid-template-columns:38% 62%;border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,17,34,.95),rgba(12,9,18,.96));border-radius:10px;overflow:hidden;box-shadow:0 18px 45px rgba(0,0,0,.3);cursor:pointer}.thumb{min-height:208px;background:linear-gradient(135deg,#1a1627,#06070b);position:relative}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,rgba(17,9,27,.5))}
.copy{padding:20px 20px 18px}.title{font:31px/1.05 Georgia,serif;color:#f0c864;margin:0 0 8px}.desc{color:#c8c1ca;line-height:1.5;margin:0 0 14px}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:18px;padding:6px 10px;color:#e6c979;font-size:13px}.heart{float:right;color:#ffd978;font-size:27px}
.detail{display:none}.detail .backtop{border:0;background:none;color:white;font-size:34px;cursor:pointer;padding:0}.detailHero{display:grid;grid-template-columns:42% 58%;gap:20px;align-items:stretch;margin-top:14px}.detailImage{border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:360px}.detailImage img{width:100%;height:100%;object-fit:cover}.detailText{padding:6px 0}.detailTitle{font:42px/1 Georgia,serif;color:#f0c864;margin:0 0 8px}.kicker{color:#aaa0ad;text-transform:uppercase;letter-spacing:2px;font-size:11px}.long{color:#d0c8d1;line-height:1.62;font-size:16px}.startBtn{display:inline-block;margin-top:18px;padding:13px 24px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(180deg,#61462a,#2b1c22);color:#fff0bb;font-weight:700;cursor:pointer}.section{margin-top:24px;padding:18px;border:1px solid rgba(212,170,85,.22);border-radius:12px;background:rgba(17,12,24,.72)}.section h3{margin:0 0 12px;color:#f2d47f;font-family:Georgia,serif}.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.route{padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(28,20,40,.6)}.route b{display:block;color:#f2d47f;margin-bottom:5px}.route small{color:#c9c0ca;line-height:1.4}.cast{display:grid;gap:8px}.castItem{padding:11px 12px;background:rgba(30,22,42,.55);border-radius:9px;color:#ddd6df}.footerNav{position:fixed;left:0;right:0;bottom:0;background:rgba(9,6,17,.94);border-top:1px solid rgba(212,170,85,.2);backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:9px 6px}.navItem{color:#cdbd97;font-size:12px;text-align:center}.navIcon{display:block;font-size:20px;margin-bottom:2px}
#game{display:none;position:fixed;inset:0;background:#080808;z-index:20}.gameImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.gameShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 45%,rgba(0,0,0,.78))}.gameBack{position:absolute;left:16px;top:16px;z-index:4;width:52px;height:52px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:white;font-size:33px;cursor:pointer}.gameContent{position:absolute;left:5%;right:5%;bottom:4%;z-index:3;max-width:850px;margin:auto}.gameRoute{display:inline-block;padding:6px 12px;background:rgba(10,10,14,.7);border-radius:14px;font-size:13px;margin-bottom:7px}.gameName{display:inline-block;padding:8px 18px;background:#795530;border-radius:11px 11px 0 0}.gameDialog{padding:18px 20px;background:rgba(9,9,12,.9);border:1px solid rgba(212,170,85,.6);border-radius:0 12px 12px 12px;font-size:19px;line-height:1.5}.gameChoices{display:grid;gap:8px;margin-top:10px}.gameChoice{padding:12px 14px;border-radius:9px;border:1px solid rgba(212,170,85,.5);background:rgba(12,12,17,.92);color:white;text-align:left;font:inherit;cursor:pointer}.gameChoice:hover{background:#33251c}
@media(max-width:760px){.card{grid-template-columns:1fr}.thumb{height:230px;min-height:0}.detailHero{grid-template-columns:1fr}.detailImage{min-height:300px}.routes{grid-template-columns:1fr}.title{font-size:27px}.detailTitle{font-size:34px}}
</style>
</head>
<body>
<div class="wrap" id="library">
  <div class="brand">Your Destiny<span>YOUR STORY · YOUR CHOICE</span></div>
  <div class="tabs" id="tabs"></div>
  <main class="list" id="list"></main>
</div>

<div class="wrap detail" id="detail">
  <button class="backtop" onclick="showLibrary()" aria-label="Назад">←</button>
  <div class="detailHero">
    <div class="detailImage"><img id="detailImg"></div>
    <div class="detailText">
      <div class="kicker">Визуальная новелла · Глава 1</div>
      <h1 class="detailTitle" id="detailTitle"></h1>
      <div class="meta" id="detailMeta"></div>
      <p class="long" id="detailDesc"></p>
      <button class="startBtn" onclick="openGame()">Начать историю</button>
    </div>
  </div>
  <section class="section">
    <h3>О чём история</h3>
    <p class="long" id="detailLong"></p>
  </section>
  <section class="section">
    <h3>Три направления</h3>
    <div class="routes" id="routes"></div>
  </section>
  <section class="section">
    <h3>Персонажи</h3>
    <div class="cast" id="cast"></div>
  </section>
</div>

<div class="footerNav">
  <div class="navItem"><span class="navIcon">▦</span>Новеллы</div>
  <div class="navItem"><span class="navIcon">♢</span>Истории</div>
  <div class="navItem"><span class="navIcon">♡</span>Избранное</div>
  <div class="navItem"><span class="navIcon">⚙</span>Настройки</div>
</div>

<div id="game">
  <img class="gameImg" src="assets/scene-bedroom.png" alt="">
  <div class="gameShade"></div>
  <button class="gameBack" onclick="closeGame()" aria-label="В меню">←</button>
  <div class="gameContent">
    <div class="gameRoute" id="gRoute"></div>
    <div class="gameName" id="gName"></div>
    <div class="gameDialog" id="gDialog"></div>
    <div class="gameChoices" id="gChoices"></div>
  </div>
</div>

<script src="novels.js"></script>
<script>
const novel = window.YD_NOVELS[0];
const tabs=["All","Romance","Fantasy","Drama","Mystery"];
let active="All";
const tabsEl=document.getElementById("tabs");
tabs.forEach((t,i)=>{const b=document.createElement("button");b.className="tab"+(i===0?" active":"");b.textContent=t;b.onclick=()=>{active=t;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderList()};tabsEl.appendChild(b)});
function renderList(){
  const extras=[novel,...window.YD_EXTRA_NOVELS];
  const match=(x)=>active==="All" || (x.genres||[x.genre]).some(g=>g.toLowerCase().includes(active.toLowerCase())) || (x.genre||"").toLowerCase()===active.toLowerCase();
  document.getElementById("list").innerHTML=extras.filter(match).map((x,i)=>`
    <article class="card" onclick="${x.id?'showDetail()':''}">
      <div class="thumb">${i===0?'<img src="assets/scene-bedroom.png" alt="">':''}</div>
      <div class="copy"><span class="heart">♡</span>
        <h2 class="title">${x.title}</h2>
        <p class="desc">${x.description}</p>
        <div class="meta">${(x.genres||[x.genre]).map(g=>`<span class="pill">${g}</span>`).join("")}</div>
      </div>
    </article>`).join("");
}
function showLibrary(){document.getElementById("detail").style.display="none";document.getElementById("library").style.display="block"}
function showDetail(){
  document.getElementById("library").style.display="none";document.getElementById("detail").style.display="block";
  document.getElementById("detailImg").src=novel.sceneAsset;
  document.getElementById("detailTitle").textContent=novel.title;
  document.getElementById("detailMeta").innerHTML=[...novel.genres,novel.status,novel.choices].map(x=>`<span class="pill">${x}</span>`).join("");
  document.getElementById("detailDesc").textContent=novel.description;
  document.getElementById("detailLong").textContent=novel.longDescription;
  document.getElementById("routes").innerHTML=Object.entries(novel.routeDescriptions).map(([k,v])=>{
    const n={romance:"Романтика",mystery:"Тайна",conflict:"Конфликт"}[k];return `<div class="route"><b>${n}</b><small>${v}</small></div>`}).join("");
  document.getElementById("cast").innerHTML=novel.characters.map(c=>`<div class="castItem"><b>${c.name}</b> — ${c.role}. ${c.note}</div>`).join("");
}
const scenes={
start:{r:"Глава 1 · Новый город",n:"Эмили",t:"Ты правда думаешь, что я поверю в это?",c:[["Сказать правду","romance"],["Спросить, что она знает","mystery"],["Перевести разговор в спор","conflict"]]},
romance:{r:"Направление · Романтика",n:"Эмили",t:"Она на секунду отводит взгляд, а затем улыбается. «Тогда останься. Хотя бы сегодня».",c:[["Остаться и поговорить","romance2"],["Спросить, почему ей важно, чтобы ты остался","mystery"],["Ответить резко","conflict"]]},
romance2:{r:"Направление · Романтика",n:"Эмили",t:"В комнате становится тихо. Между вами появляется ощущение, что эта встреча может изменить гораздо больше, чем вы планировали.",c:[["Продолжить","end"]]},
mystery:{r:"Направление · Тайна",n:"Эмили",t:"Её улыбка исчезает. «Ты слишком много спрашиваешь. И это опаснее, чем ты думаешь».",c:[["Попросить объяснить всё","mystery2"],["Сделать вид, что поверил","romance"],["Потребовать ответы","conflict"]]},
mystery2:{r:"Направление · Тайна",n:"Эмили",t:"Она достаёт старую фотографию. На обороте — дата завтрашнего дня и имя, которое ты никогда ей не называл.",c:[["Взять фотографию","end"]]},
conflict:{r:"Направление · Конфликт",n:"Эмили",t:"«Хорошо», — холодно отвечает она. «Тогда больше не притворяйся, что тебе есть до этого дело».",c:[["Остановить её","conflict2"],["Позволить ей уйти","end"],["Извиниться","romance"]]},
conflict2:{r:"Направление · Конфликт",n:"Эмили",t:"Она останавливается у двери. Теперь решение за тобой — сказать то, что действительно думаешь, или потерять этот шанс.",c:[["Сказать правду","end"]]},
end:{r:"Конец главы 1",n:"",t:"Глава 1 закончена. Твой выбор определил направление истории. Продолжение следует…",c:[["Вернуться в каталог","menu"]]}
};
let scene="start";
function openGame(){document.getElementById("game").style.display="block";scene=localStorage.getItem("yd_scene")||"start";renderGame()}
function closeGame(){document.getElementById("game").style.display="none"}
function renderGame(){const s=scenes[scene];document.getElementById("gRoute").textContent=s.r;document.getElementById("gName").textContent=s.n;document.getElementById("gName").style.display=s.n?"inline-block":"none";document.getElementById("gDialog").textContent=s.t;document.getElementById("gChoices").innerHTML=s.c.map(([txt,next])=>`<button class="gameChoice" onclick="go('${next}')">${txt}</button>`).join("")}
function go(next){if(next==="menu"){localStorage.removeItem("yd_scene");closeGame();showLibrary();return}scene=next;localStorage.setItem("yd_scene",scene);renderGame()}
renderList();
</script>
</body>
</html>
